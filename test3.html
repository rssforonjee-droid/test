<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Выиграй гарантированный приз — Seamless Marquee RTL</title>
<style>
  :root{
    --circle: 144px;     /* размер кружков */
    --gap: 16px;         /* расстояние между кружками */
    --track-h: calc(var(--circle) + 8px);
    --text: #e5e7eb;
    --page-bg: #0b0f14;  /* фон страницы для демо */
  }

  html,body{height:100%}
  body{
    margin:0;
    background: var(--page-bg);
    color:var(--text);
    font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  }

  /* Блок на всю ширину, без рамок и теней */
  .promo{
    width:100vw;
    box-sizing:border-box;
    padding:12px 0;
    margin:0;
  }

  .inner{
    display:grid;
    grid-template-rows: auto var(--track-h) auto;
    gap:12px;
  }

  .title{
    font-weight:900;
    font-size:clamp(18px,3.5vw,22px);
    letter-spacing:.2px;
    padding:0 12px;
  }

  /* Дорожка */
  .track-wrap{
    position:relative; height:var(--track-h);
    overflow:hidden;
  }
  /* мягкое затемнение по краям */
  .track-wrap::before,
  .track-wrap::after{
    content:""; position:absolute; top:0; bottom:0; width:36px; pointer-events:none;
    background: linear-gradient(90deg, var(--page-bg) 0%, #0000 80%);
    z-index:2;
  }
  .track-wrap::before{ left:0; transform: scaleX(-1); }
  .track-wrap::after { right:0; }

  .track{
    position:absolute; inset:0 auto 0 0; height:100%;
    display:flex; align-items:center;
    gap:var(--gap);
    will-change: transform;
    /* переменные, которые JS проставит */
    --segpx: 600px;            /* реальная ширина первой группы (JS) */
    --dur: 8s;                 /* длительность одного цикла (JS) */
    animation: marquee var(--dur) linear infinite;
  }

  /* Бесшовный сдвиг: строго на ширину первой группы */
  @keyframes marquee{
    from{ transform: translateX(0) }             /* старт */
    to  { transform: translateX(calc(-1 * var(--segpx))) } /* ушли ровно на ширину группы */
  }

  /* Группа кружков (первая и её клон) */
  .group{
    display:flex; align-items:center; gap:var(--gap);
    flex:0 0 auto; /* важен фиксированный размер блока */
  }

  /* Кружок приза */
  .prize{
    flex:0 0 auto;
    width:var(--circle); height:var(--circle);
    border-radius:50%;
    display:grid; place-items:center;
    font-weight:900; font-size:22px; color:#0b1220;
    text-align:center; line-height:1.1;
    user-select:none;
    box-shadow: inset 0 0 0 1px #ffffff33, 0 10px 24px rgba(0,0,0,.25);
  }
  .prize small{ display:block; font-size:12px; font-weight:800; color:#0b1220cc }

  .p1{ background: radial-gradient(circle at 35% 35%, #fff6, #fde68a 40%, #f59e0b 80%); }
  .p2{ background: radial-gradient(circle at 35% 35%, #fff6, #93c5fd 40%, #60a5fa 80%); }
  .p3{ background: radial-gradient(circle at 35% 35%, #fff6, #86efac 40%, #22c55e 80%); }
  .p4{ background: radial-gradient(circle at 35% 35%, #fff6, #fda4af 40%, #f43f5e 80%); }
  .p5{ background: radial-gradient(circle at 35% 35%, #fff6, #c4b5fd 40%, #8b5cf6 80%); }

  /* Нижний ряд: центрируем кнопку */
  .row{
    display:flex; justify-content:center; align-items:center;
    padding:0 12px;
  }
  .cta{
    appearance:none; cursor:pointer; user-select:none;
    padding:12px 18px; border-radius:999px; font-weight:900; letter-spacing:.2px;
    background:linear-gradient(180deg,#fcd34d,#f59e0b); color:#111827; border:none;
    box-shadow:0 8px 18px rgba(255,200,0,.25);
  }

  /* По желанию: пауза на hover */
  /* .track-wrap:hover .track{ animation-play-state: paused; } */

  @media (prefers-reduced-motion: reduce){
    .track{ animation:none }
  }
</style>
</head>
<body>

    <a href="test4.html"> Миниигра </a>

<section class="promo" aria-label="Промо розыгрыша — бесшовная лента">
  <div class="inner">
    <h2 class="title">Выиграй гарантированный приз</h2>

    <div class="track-wrap" id="wrap">
      <div class="track" id="track">
        <!-- Группа А: ровно 5 кружков -->
        <div class="group" id="groupA">
          <div class="prize p1">+10₽<small>на счёт</small></div>
          <div class="prize p2">×2<small>к шансу</small></div>
          <div class="prize p3">-50%<small>комиссии</small></div>
          <div class="prize p4">+50₽<small>на счёт</small></div>
          <div class="prize p5">Бонус<small>скидка</small></div>
        </div>
        <!-- Клон Б добавим из JS (точная копия ширины А) -->
      </div>
    </div>

    <div class="row">
      <button class="cta" type="button">Участвовать</button>
    </div>
  </div>
</section>

<script>
(function(){
  // Константа скорости: пикселей в секунду (подгони под нужную «в 2 раза быстрее»)
  const PX_PER_SEC = 90; // 180 px/с — довольно бодро; было ~90 px/с

  function setupMarquee(){
    const track  = document.getElementById('track');
    const groupA = document.getElementById('groupA');

    // Если клон уже есть — уберём и создадим заново (на случай ресайза)
    const oldClone = track.querySelector('.group.clone');
    if (oldClone) oldClone.remove();

    // Клонируем первую группу — для бесшовности
    const clone = groupA.cloneNode(true);
    clone.classList.add('clone');
    track.appendChild(clone);

    // Ждём, пока браузер посчитает размеры
    requestAnimationFrame(() => {
      const segWidth = groupA.getBoundingClientRect().width;

      // Проставляем CSS-переменные в px
      track.style.setProperty('--segpx', segWidth + 'px');

      // Вычисляем длительность цикла из реальной ширины сегмента и заданной скорости (px/s)
      const duration = Math.max(0.001, segWidth / PX_PER_SEC);
      track.style.setProperty('--dur', duration + 's');

      // Сбрасываем анимацию, чтобы применились новые переменные
      track.style.animation = 'none';
      // форс-рефлоу
      void track.offsetWidth;
      // снова включаем
      track.style.animation = '';
    });
  }

  // Инициализация
  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', setupMarquee);
  } else {
    setupMarquee();
  }

  // Пересчёт при изменении размеров окна (адаптив/мобильные клавы)
  window.addEventListener('resize', () => {
    // Слегка дебаунсим
    clearTimeout(window.__marqueeResizeT);
    window.__marqueeResizeT = setTimeout(setupMarquee, 120);
  });
})();
</script>
</body>
</html>

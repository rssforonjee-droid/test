<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bank Cards — Drawer Reveal (Clean, No Opacity)</title>
<style>
  :root{
    --card-w: min(420px, 92vw);
    --card-h: 230px;
    --gap: 16px;        /* финальный зазор между картами */
    --radius: 18px;
    --shadow: 0 14px 34px rgba(0,0,0,.22);
    --enter-dur: .8s;   /* длительность выезда */
    --delay-step: .12s; /* задержка для очередности */
  }

  html,body{height:100%}
  body{
    margin:0; display:grid; place-content:center; gap:18px;
    background: radial-gradient(1000px 700px at 20% 10%, #0b1220 0, #060a12 60%, #04070d 100%);
    color:#e5e7eb; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  }

  .toolbar{
    display:flex; gap:8px; align-items:center; justify-content:center;
    background:#0f1729; border:1px solid #1f2937; border-radius:12px; padding:8px;
    box-shadow: 0 6px 18px rgba(0,0,0,.25);
  }
  .btn{
    appearance:none; cursor:pointer; user-select:none;
    padding:8px 12px; border-radius:10px; font-weight:700; letter-spacing:.2px;
    border:1px solid #334155; background:#0b1220; color:#e5e7eb;
  }
  .btn:hover{ background:#0a101c }

  .stack{
    width:var(--card-w);
    position:relative;
    padding-top: calc(var(--card-h) + var(--gap)*2);
  }

  .card{
    position:absolute; left:50%; width:var(--card-w); height:var(--card-h);
    transform: translateX(-50%);  /* Y задаём анимацией */
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow:hidden; isolation:isolate;
    will-change: transform, filter;
    top:0;
    opacity:1;               /* БЕЗ изменений прозрачности */
    transform-origin: 50% 50%;
    filter: blur(3px);       /* только размытие в старте */
    z-index: var(--z, 1);    /* аккуратное наложение */
  }

  /* порядок слоёв: верхняя (последняя в DOM) выше остальных */
  .card[data-i="0"]{ --i:0; --z:1 }
  .card[data-i="1"]{ --i:1; --z:2 }
  .card[data-i="2"]{ --i:2; --z:3 }

  /* Чистая анимация движения без opacity */
  .stack.enter .card{
    animation: c_draw var(--enter-dur) cubic-bezier(.18,.9,.22,1) forwards;
    animation-delay: calc(var(--i) * var(--delay-step));
  }
  @keyframes c_draw{
    60% { filter: blur(1px); }
    100%{
      filter: blur(0);
      transform: translate(-50%, calc(var(--i) * var(--gap)));
    }
  }

  /* Оформление карт и статический контент */
  .skin{
    position:absolute; inset:0;
    /* НЕпрозрачные градиенты — исключают просвет */
    background: linear-gradient(150deg, var(--c1), var(--c2) 55%, var(--c3));
  }
  .skin::after{
    content:""; position:absolute; inset:auto; right:-30px; top:-30px;
    width:220px; height:220px; border-radius:50%;
    background: radial-gradient(circle at 30% 30%, #ffffff55 0 30%, #ffffff12 31% 55%, transparent 60%);
    filter: blur(2px); opacity:.5; mix-blend-mode: screen;
  }

  .content{
    position:absolute; inset:0; display:flex; flex-direction:column;
    padding:18px; color:#fff;
  }
  .row{ display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .brand{ font-weight:800; letter-spacing:.6px; font-size:15px; text-transform:uppercase; opacity:.9; }
  .chip{
    width:42px; height:30px; border-radius:6px; background:
      linear-gradient(180deg,#ffeaa7,#facc15);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.25);
  }

  .number{ margin-top:18px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing:.8px; opacity:.9; }
  .balance{ margin-top:auto; display:flex; justify-content:space-between; align-items:end; gap:8px; }
  .balance .label{ font-size:12px; opacity:.8 }
  .balance .value{ font-size:28px; font-weight:900; letter-spacing:.3px; }

  @media (prefers-reduced-motion: reduce){
    .card{ animation:none !important; filter:none !important;
           transform: translate(-50%, calc(var(--i) * var(--gap))) !important; }
  }
</style>
</head>
<body>

<a href="test3.html"> Анимация блока розыгрыша </a>


  <div class="toolbar">
    <button class="btn" id="replay">Replay</button>
  </div>

  <section class="stack" id="stack" aria-label="Банковские карты">
    <!-- Карта 1 -->
    <article class="card" data-i="0" style="--c1:#1e40af; --c2:#2563eb; --c3:#0ea5e9">
      <div class="skin"></div>
      <div class="content" role="group" aria-label="Карта • Баланс 152 340,75 ₽">
        <div class="row">
          <div class="brand">Blue Bank</div>
          <div class="chip" aria-hidden="true"></div>
        </div>
        <div class="number" aria-label="Номер карты">**** **** **** 1289</div>
        <div class="balance">
          <div class="label">Баланс</div>
          <div class="value" aria-live="polite">152 340,75&nbsp;₽</div>
        </div>
      </div>
    </article>

    <!-- Карта 2 -->
    <article class="card" data-i="1" style="--c1:#065f46; --c2:#059669; --c3:#10b981">
      <div class="skin"></div>
      <div class="content" role="group" aria-label="Карта • Баланс 72 910,00 ₽">
        <div class="row">
          <div class="brand">Emerald</div>
          <div class="chip" aria-hidden="true"></div>
        </div>
        <div class="number">**** **** **** 4410</div>
        <div class="balance">
          <div class="label">Баланс</div>
          <div class="value">72 910,00&nbsp;₽</div>
        </div>
      </div>
    </article>

    <!-- Карта 3 -->
    <article class="card" data-i="2" style="--c1:#6d28d9; --c2:#8b5cf6; --c3:#a78bfa">
      <div class="skin"></div>
      <div class="content" role="group" aria-label="Карта • Баланс 9 502,30 ₽">
        <div class="row">
          <div class="brand">Violet</div>
          <div class="chip" aria-hidden="true"></div>
        </div>
        <div class="number">**** **** **** 9932</div>
        <div class="balance">
          <div class="label">Баланс</div>
          <div class="value">9 502,30&nbsp;₽</div>
        </div>
      </div>
    </article>
  </section>

<script>
  const stack = document.getElementById('stack');
  const replayBtn = document.getElementById('replay');

  function playAnimation(){
    stack.classList.remove('enter');
    void stack.offsetWidth;         // форс-рефлоу
    stack.classList.add('enter');   // запуск
  }

  playAnimation();
  replayBtn.addEventListener('click', playAnimation);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Колесо призов — всегда вперёд</title>
<style>
  :root{
    --size: 360px;          /* диаметр колеса */
    --arrow-size: 24px;     /* размер стрелки */
    --bg1:#0b1020; --bg2:#0a1324;
    --text:#e5e7eb;
  }
  html,body{height:100%}
  body{
    margin:0; background: radial-gradient(120% 80% at 20% 0%, var(--bg2), var(--bg1));
    color:var(--text); font-family: Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    display:grid; place-items:center; overflow:hidden;
  }
  .app{ display:grid; gap:16px; justify-items:center }

  .wheel-wrap{ position:relative; width:var(--size); height:var(--size); }
  .wheel{
    position:absolute; inset:0; border-radius:50%;
    box-shadow: 0 18px 50px #0008, inset 0 0 0 6px #111827, inset 0 0 0 2px #ffffff22;
    overflow:hidden; display:grid; place-items:center; background:#0b1020;
    transform: rotate(0deg);
  }
  .slices{
    position:absolute; inset:0; border-radius:50%;
    background:
      conic-gradient(from -90deg,
        #f59e0b 0   12.5%,
        #60a5fa 12.5% 25%,
        #22c55e 25% 37.5%,
        #f43f5e 37.5% 50%,
        #8b5cf6 50% 62.5%,
        #34d399 62.5% 75%,
        #fda4af 75% 87.5%,
        #93c5fd 87.5% 100%
      );
  }
  .labels{ position:absolute; inset:0; border-radius:50%; }
  .label{ position:absolute; left:50%; top:50%; transform-origin:0 0; font-weight:900; font-size:14px; color:#0b1020; }
  .label span{
    display:inline-block; transform: translate(110px, -12px) rotate(var(--unrotate));
    background:#ffffffee; padding:4px 8px; border-radius:8px; box-shadow:0 6px 14px #0005;
  }
  .hub{
    position:absolute; width:84px; height:84px; border-radius:50%;
    background: radial-gradient(circle at 35% 35%, #fff8, #cbd5e1 40%, #94a3b8 85%);
    box-shadow: inset 0 0 0 4px #0f1729, 0 8px 20px #0008; z-index:2;
  }

  .arrow{
    position:absolute; left:50%; top:-6px; transform:translateX(-50%);
    width:0; height:0; border-left: var(--arrow-size) solid transparent;
    border-right: var(--arrow-size) solid transparent;
    border-top: calc(var(--arrow-size) * 1.3) solid #fcd34d;
    filter: drop-shadow(0 6px 10px #0008); z-index:3;
  }
  .arrow::after{
    content:""; position:absolute; left:50%; top:calc(var(--arrow-size)*1.3 - 3px);
    transform:translateX(-50%); width:10px; height:16px; background:#fcd34d; border-radius:0 0 6px 6px;
  }

  .controls{ display:flex; gap:10px; justify-content:center; align-items:center }
  .btn{
    appearance:none; cursor:pointer; user-select:none;
    padding:12px 18px; border-radius:999px; font-weight:900; letter-spacing:.2px;
    color:#0b1020; border:none; box-shadow:0 10px 24px #0006;
    background:linear-gradient(180deg,#fcd34d,#f59e0b);
  }
  .btn[disabled]{ opacity:.6; cursor:not-allowed }
  .result{ min-height:1.4em; font-weight:700; letter-spacing:.2px; opacity:.9; text-align:center; }

  .confetti{
    position:fixed; width:7px; height:11px; border-radius:2px; pointer-events:none;
    background: var(--c,#f59e0b);
    transform: translate(-50%,-50%) rotate(var(--r,0deg));
    left:var(--x); top:var(--y); z-index:9;
    animation: fly var(--dur, 900ms) cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes fly{
    0%{ transform: translate(-50%,-50%) rotate(var(--r)) scale(.9); }
    80%{ transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(calc(var(--r) + 120deg)) scale(1); }
    100%{ transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(calc(var(--r) + 180deg)) scale(.98); opacity:0; }
  }

  @media (prefers-reduced-motion: reduce){
    .wheel{ transition:none !important }
    .confetti{ animation:none !important }
  }
</style>
</head>
<body>

<a href="test6.html"> снежки </a>

<div class="app">
  <div class="wheel-wrap">
    <div class="arrow" aria-hidden="true"></div>

    <div class="wheel" id="wheel" aria-label="Колесо призов" role="img">
      <div class="slices" aria-hidden="true"></div>
      <div class="labels" id="labels" aria-hidden="true"></div>
      <div class="hub" aria-hidden="true"></div>
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="spinBtn" type="button">Крутить</button>
  </div>
  <div class="result" id="result"></div>
</div>

<script>
(() => {
  // Сектора (подписи)
  const sectors = [
    { label: '+10₽ на счёт' },
    { label: '×2 к шансу'   },
    { label: '-50% комиссия'},
    { label: '+50₽ на счёт' },
    { label: 'Стикерпак'    },
    { label: 'Промокод'     },
    { label: '+25₽ на счёт' },
    { label: 'Бонус-скидка' },
  ];
  const COLORS = ['#f59e0b','#f43f5e','#22d3ee','#34d399','#eab308','#93c5fd'];

  const N = sectors.length;
  const slice = 360 / N;
  const wheel = document.getElementById('wheel');
  const labelsWrap = document.getElementById('labels');
  const btn = document.getElementById('spinBtn');
  const res = document.getElementById('result');

  // Подписываем сектора вокруг круга
  labelsWrap.innerHTML = '';
  for (let i=0;i<N;i++){
    const el = document.createElement('div');
    el.className = 'label';
    const centerAngle = -90 + slice * (i + 0.5); // 0° = вверх (под стрелкой)
    el.style.transform = `rotate(${centerAngle}deg)`;
    el.innerHTML = `<span style="--unrotate:${-centerAngle}deg">${sectors[i].label}</span>`;
    labelsWrap.appendChild(el);
  }

  // Храним абсолютный угол (монотонно увеличивается) — это гарантирует вращение только вперёд
  let angleAbs = 0;
  let spinning = false;

  btn.addEventListener('click', spin);

  function mod360(a){ let x=a%360; if (x<0) x+=360; return x; }

  function spin(){
    if (spinning) return;
    spinning = true;
    btn.disabled = true;
    res.textContent = '';

    // Выбираем победный сектор
    const winIndex = Math.floor(Math.random()*N);
    const targetCenter = -90 + slice*(winIndex + 0.5); // градусы
    const desiredMod = mod360(-targetCenter);          // какой угол (mod 360) должен быть у колеса

    // Текущий угол по модулю 360
    const currentMod = mod360(angleAbs);

    // Положительная дельта до нужного сектора (минимальная вперёд)
    let delta = desiredMod - currentMod;
    if (delta <= 0) delta += 360;

    // Добавим 3–5 полных оборотов для красивой инерции
    const extraTurns = 3 + Math.floor(Math.random()*3); // 3..5
    delta += extraTurns*360;

    // Новый абсолютный угол (строго больше прежнего)
    angleAbs += delta;

    // Плавное «ускорение-замедление» одной кривой (ease-out, как торможение)
    const duration = 4200; // мс
    wheel.style.transition = `transform ${duration}ms cubic-bezier(.12,.7,.07,1)`;
    wheel.style.transform  = `rotate(${angleAbs}deg)`;

    setTimeout(() => {
      const prize = sectors[winIndex].label;
      res.textContent = `Ваш приз: ${prize}! 🎉`;

      // Конфетти из-под стрелки
      const rect = wheel.getBoundingClientRect();
      const cx = rect.left + rect.width/2;
      const cy = rect.top;
      burst(cx, cy + 8, 28);

      btn.disabled = false;
      spinning = false;
    }, duration + 60);
  }

  // Конфетти
  function burst(x,y,count=24){
    for(let i=0;i<count;i++){
      const p = document.createElement('i');
      p.className = 'confetti';
      const a = (Math.PI*2) * (i/count) + (Math.random()*0.7 - 0.35);
      const r = 80 + Math.random()*60;
      const dx = Math.cos(a)*r, dy = Math.sin(a)*r - 20;
      p.style.setProperty('--x', x+'px');
      p.style.setProperty('--y', y+'px');
      p.style.setProperty('--dx', dx+'px');
      p.style.setProperty('--dy', dy+'px');
      p.style.setProperty('--r', ((Math.random()*360)|0)+'deg');
      p.style.setProperty('--c', COLORS[i%COLORS.length]);
      p.style.setProperty('--dur', (800 + (Math.random()*500|0))+'ms');
      document.body.appendChild(p);
      p.addEventListener('animationend', ()=> p.remove(), {once:true});
    }
  }
})();
</script>
</body>
</html>

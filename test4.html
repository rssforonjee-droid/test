<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Мини-игра: Попади по шарику (ускорение + больше шариков + угол ружья)</title>
<style>
  :root{
    --bg1:#0b1020; --bg2:#0a1324;
    --accent:#ef4444;   /* красный прицел */
    --good:#22c55e;     /* зелёный */
    --bad:#f59e0b;      /* оранжевый (тост) */
  }
  html,body{height:100%}
  body{
    margin:0; background: radial-gradient(120% 80% at 20% 0%, var(--bg2), var(--bg1));
    color:#e5e7eb; font-family: Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    overflow:hidden;
  }

  /* Сцена */
  .game{
    position:relative; width:100vw; height:100vh; overflow:hidden;
    user-select:none;
  }

  /* «Детское ружьё» — повернули и вынесли вперёд по слоям */
/* «Детское ружьё» — теперь из правого нижнего угла в левый верхний */
.gun{
  position:absolute;
  right:-44px;           /* было left:-44px */
  bottom:40px;
  width:260px;
  height:140px;

  /* сначала зеркалим по X (направление влево), затем чуть приподнимаем вверх влево */
  transform: scaleX(-1) rotate(-14deg);
  transform-origin: 200px 100px; /* точка вращения ближе к прикладу после зеркалирования */

  pointer-events:none;
  opacity:.95;
  filter: drop-shadow(0 8px 16px #0008);
  z-index:4;
}


  /* Шарики */
  .balloon{
    position:absolute; width:64px; height:64px; border-radius:50%;
    display:grid; place-items:center; font-weight:900; color:#0b1020;
    box-shadow: inset 0 0 0 2px #ffffff44, 0 10px 18px #0006;
    transform: translate(-50%,-50%);
  }
  .b1{ background: radial-gradient(circle at 35% 35%, #fff6, #fef08a 45%, #f59e0b 85%); }
  .b2{ background: radial-gradient(circle at 35% 35%, #fff6, #93c5fd 45%, #60a5fa 85%); }
  .b3{ background: radial-gradient(circle at 35% 35%, #fff6, #86efac 45%, #22c55e 85%); }
  .b4{ background: radial-gradient(circle at 35% 35%, #fff6, #c4b5fd 45%, #8b5cf6 85%); }
  .b5{ background: radial-gradient(circle at 35% 35%, #fff6, #fda4af 45%, #f43f5e 85%); }

  /* Красный прицел */
  .aim{
    position:absolute; width:68px; height:68px; transform: translate(-50%,-50%);
    border:3px solid var(--accent); border-radius:50%;
    box-shadow: 0 0 0 2px #0005, 0 0 22px 2px #ef444440;
    pointer-events:none; z-index:5;
  }
  .aim::before, .aim::after{
    content:""; position:absolute; left:50%; top:50%; background: var(--accent);
    transform: translate(-50%,-50%);
  }
  .aim::before{ width:2px; height:86%; }    /* вертикальная линия */
  .aim::after { width:86%; height:2px; }    /* горизонтальная линия */

  /* HUD */
  .hud{
    position:fixed; left:50%; bottom:20px; transform:translateX(-50%);
    display:flex; gap:12px; align-items:center; z-index:6;
  }
  .btn{
    appearance:none; cursor:pointer; user-select:none;
    padding:12px 18px; border-radius:999px; font-weight:900; letter-spacing:.2px;
    color:#0b1020; border:none; box-shadow:0 8px 18px #0006;
  }
  .btn-primary{ background:linear-gradient(180deg,#fcd34d,#f59e0b); }
  .btn-ghost{ background:#ffffff10; color:#e5e7eb; border:1px solid #ffffff22 }
  .note{ font-size:14px; opacity:.85 }

  /* Тост «мимо» */
  .toast{
    position:fixed; left:50%; bottom:90px; transform:translateX(-50%);
    background:linear-gradient(180deg,#1f2937,#111827); border:1px solid #374151; color:#fff;
    padding:10px 14px; border-radius:10px; display:none; z-index:7;
    box-shadow:0 10px 24px #0008;
  }
  .toast.show{ display:flex; gap:10px; align-items:center; }
  .toast .dot{ width:10px; height:10px; border-radius:50%; background:var(--bad); box-shadow:0 0 10px #f59e0b80; }

  /* Модал с призом */
  .modal{
    position:fixed; inset:0; display:none; place-items:center; z-index:10;
    background:#0008;
  }
  .modal.show{ display:grid; }
  .dialog{
    width:min(420px,92vw); background:linear-gradient(180deg,#0f1729,#0b1220);
    border:1px solid #1f2937; border-radius:16px; padding:20px; text-align:center;
    box-shadow:0 20px 60px #0009;
  }
  .prize-ring{
    width:120px; height:120px; margin:0 auto 12px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #fff6, #fde68a 40%, #f59e0b 80%);
    box-shadow: inset 0 0 0 2px #ffffff66, 0 12px 24px #0008;
    display:grid; place-items:center; color:#0b1020; font-weight:900; font-size:26px;
  }

  /* Конфетти */
  .confetti{
    position:fixed; width:7px; height:11px; border-radius:2px; pointer-events:none;
    background: var(--c,#f59e0b);
    transform: translate(-50%,-50%) rotate(var(--r,0deg));
    left:var(--x); top:var(--y);
    z-index:9;
    animation: fly var(--dur, 900ms) cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes fly{
    0%{ transform: translate(-50%,-50%) rotate(var(--r)) scale(.9); }
    80%{ transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(calc(var(--r) + 120deg)) scale(1); }
    100%{ transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(calc(var(--r) + 180deg)) scale(.98); opacity:0; }
  }

  /* Заголовок */
  .title{
    position:fixed; left:50%; top:14px; transform:translateX(-50%); z-index:3;
    font-weight:900; letter-spacing:.3px; text-align:center;
    text-shadow:0 2px 10px #0007;
  }
</style>
</head>
<body>

<a href="test5.html"> колесо призов </a>

  <div class="game" id="game" aria-label="Мини-игра">
    <div class="title">Выиграй гарантированный приз</div>

    <!-- ружьё (SVG), чуть длиннее ствол -->
    <svg class="gun" viewBox="0 0 260 140" aria-hidden="true">
      <defs>
        <linearGradient id="g1" x1="0" x2="1">
          <stop offset="0" stop-color="#a16207"/><stop offset="1" stop-color="#f59e0b"/>
        </linearGradient>
      </defs>
      <!-- приклад -->
      <path d="M10,100 Q35,78 70,78 L110,78 L110,125 L65,125 Q35,125 10,100 Z" fill="url(#g1)" stroke="#000" stroke-opacity=".25"/>
      <!-- цевьё -->
      <rect x="110" y="86" width="34" height="18" rx="9" fill="#6b7280" stroke="#000" stroke-opacity=".25"/>
      <!-- ствол (длиннее) -->
      <rect x="140" y="88" width="110" height="12" rx="6" fill="#9ca3af" stroke="#000" stroke-opacity=".25"/>
      <!-- мушка -->
      <rect x="246" y="84" width="6"  height="6" rx="2" fill="#9ca3af"/>
      <!-- курок -->
      <path d="M95,100 q12,0 12,12 h-10 q-2,-8 -2,-12z" fill="#374151"/>
      <!-- винт -->
      <circle cx="70" cy="100" r="6" fill="#111827" stroke="#000" stroke-opacity=".4"/>
    </svg>

    <!-- прицел -->
    <div class="aim" id="aim" aria-hidden="true"></div>
  </div>

  <div class="hud">
    <button class="btn btn-primary" id="shootBtn" type="button">Стрелять</button>
    <button class="btn btn-ghost" id="resetBtn" type="button">Сбросить</button>
    <div class="note">Попади прицелом по шарику</div>
  </div>

  <div class="toast" id="toast"><span class="dot"></span> Мимо! Попробуй ещё раз.</div>

  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <div class="dialog">
      <div class="prize-ring">🎁</div>
      <h3 style="margin:8px 0 6px">Есть попадание!</h3>
      <p style="margin:0 0 12px; color:#cbd5e1">Ты выиграл гарантированный приз.</p>
      <button class="btn btn-primary" id="againBtn" type="button">Ещё раз</button>
    </div>
  </div>

<script>
(function(){
  const game   = document.getElementById('game');
  const aimEl  = document.getElementById('aim');
  const shoot  = document.getElementById('shootBtn');
  const reset  = document.getElementById('resetBtn');
  const toast  = document.getElementById('toast');
  const modal  = document.getElementById('modal');
  const again  = document.getElementById('againBtn');

  const COLORS = ['#f59e0b','#f43f5e','#22d3ee','#34d399','#eab308','#93c5fd'];

  // -------- Настройки (под тебя) --------
  const SPEED_MULT   = 1.9;   // ускорение прицела (1 = прежняя скорость)
  const BALLOON_COUNT= 12;    // было 6 → стало больше
  const BAL_MIN = 48, BAL_MAX = 72;    // px
  const AIM_R = 34; // радиус прицела (68/2)
  let W=innerWidth, H=innerHeight;

  // -------- Состояние --------
  const balloons = []; // {el,x,y,r,vx,vy}
  const aim = {x: W*0.6, y: H*0.4, vx: 140*SPEED_MULT, vy: 90*SPEED_MULT};
  let raf = 0, last = performance.now();

  // -------- Утилиты --------
  const rnd = (a,b)=> a + Math.random()*(b-a);

  function position(el, x, y){ el.style.left = x+'px'; el.style.top = y+'px'; }

  function spawnBalloons(){
    balloons.splice(0, balloons.length);
    [...game.querySelectorAll('.balloon')].forEach(n=>n.remove());
    for (let i=0;i<BALLOON_COUNT;i++){
      const el = document.createElement('div');
      el.className = 'balloon b' + ((i%5)+1);
      const r = rnd(BAL_MIN, BAL_MAX)/2;
      const x = rnd(r+40, W - r - 20);
      const y = rnd(r+40, H*0.75 - r - 60);
      // скорость шариков немного выше, чтобы сцена оживилась
      const vx = rnd(-55, 55);
      const vy = rnd(-40, 40);
      el.style.width = (r*2)+'px';
      el.style.height= (r*2)+'px';
      game.appendChild(el);
      balloons.push({el,x,y,r,vx,vy});
      position(el, x, y);
    }
  }

  // конфетти
  function confetti(x,y, count=26){
    for(let i=0;i<count;i++){
      const p = document.createElement('i');
      p.className = 'confetti';
      const a = (Math.PI*2) * (i/count) + (Math.random()*0.7 - 0.35);
      const r = 70 + Math.random()*60;
      const dx = Math.cos(a)*r, dy = Math.sin(a)*r - 20;
      p.style.setProperty('--x', x+'px');
      p.style.setProperty('--y', y+'px');
      p.style.setProperty('--dx', dx+'px');
      p.style.setProperty('--dy', dy+'px');
      p.style.setProperty('--r', ((Math.random()*360)|0)+'deg');
      p.style.setProperty('--c', COLORS[i%COLORS.length]);
      p.style.setProperty('--dur', (800 + (Math.random()*500|0))+'ms');
      document.body.appendChild(p);
      p.addEventListener('animationend', ()=> p.remove(), {once:true});
    }
  }

  function showToast(msg='Мимо! Попробуй ещё раз.'){
    toast.textContent = msg;
    const dot = document.createElement('span'); dot.className = 'dot';
    toast.prepend(dot);
    toast.classList.add('show');
    clearTimeout(showToast.t);
    showToast.t = setTimeout(()=> toast.classList.remove('show'), 1700);
  }

  function showWin(x,y){
    confetti(x,y, 30);
    modal.classList.add('show');
  }
  function hideWin(){ modal.classList.remove('show'); }

  // попадание?
  function handleShoot(){
    const ax = aim.x, ay = aim.y;
    let hitIndex = -1;
    for (let i=0;i<balloons.length;i++){
      const b = balloons[i];
      const dx = b.x - ax, dy = b.y - ay;
      const d  = Math.hypot(dx,dy);
      if (d <= b.r) { hitIndex = i; break; }
    }
    if (hitIndex >= 0){
      const b = balloons[hitIndex];
      b.el.remove();
      balloons.splice(hitIndex,1);
      showWin(ax, ay);
    } else {
      showToast();
    }
  }

  // основной цикл
  function tick(now){
    const dt = Math.min(0.05, (now - last)/1000);
    last = now;

    // прицел (быстрее)
    aim.x += aim.vx * dt;
    aim.y += aim.vy * dt;
    if (aim.x < AIM_R+8){ aim.x = AIM_R+8; aim.vx *= -1; }
    if (aim.x > W-(AIM_R+8)){ aim.x = W-(AIM_R+8); aim.vx *= -1; }
    if (aim.y < AIM_R+8){ aim.y = AIM_R+8; aim.vy *= -1; }
    if (aim.y > H-(AIM_R+8)){ aim.y = H-(AIM_R+8); aim.vy *= -1; }
    position(aimEl, aim.x, aim.y);

    // шарики — немного быстрее и с дрейфом
    for (const b of balloons){
      b.x += b.vx * dt;
      b.y += b.vy * dt + Math.sin(now/1000 + b.vx*0.05) * 8 * dt;
      if (b.x < b.r+8){ b.x = b.r+8; b.vx *= -1; }
      if (b.x > W-(b.r+8)){ b.x = W-(b.r+8); b.vx *= -1; }
      if (b.y < b.r+8){ b.y = b.r+8; b.vy *= -1; }
      if (b.y > H*0.8-(b.r+8)){ b.y = H*0.8-(b.r+8); b.vy *= -1; }
      position(b.el, b.x, b.y);
    }

    raf = requestAnimationFrame(tick);
  }

  function start(){
    W = innerWidth; H = innerHeight;
    spawnBalloons();
    aim.x = W*0.58; aim.y = H*0.42;
    // слегка рандомизируем направление, но с ускорением
    const signX = Math.random()<.5?-1:1;
    const signY = Math.random()<.5?-1:1;
    aim.vx = 150 * SPEED_MULT * signX;
    aim.vy = 100 * SPEED_MULT * signY;
    position(aimEl, aim.x, aim.y);
    cancelAnimationFrame(raf);
    last = performance.now();
    raf = requestAnimationFrame(tick);
  }

  // события
  document.getElementById('shootBtn').addEventListener('click', handleShoot);
  document.getElementById('resetBtn').addEventListener('click', start);
  document.getElementById('againBtn').addEventListener('click', ()=>{ hideWin(); start(); });
  window.addEventListener('resize', ()=> {
    clearTimeout(window.__rsT);
    window.__rsT = setTimeout(start, 120);
  });

  // запуск
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else { start(); }
})();
</script>
</body>
</html>
